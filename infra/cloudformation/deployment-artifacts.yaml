AWSTemplateFormatVersion: '2010-09-09'
Description: Deployment artifact bucket for Transit Event Processing Platform.

Parameters:
  ProjectName:
    Type: String
    Default: transit-event
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, test, prod]

Resources:
  DeploymentArtifactBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub ${ProjectName}-${Environment}-${AWS::AccountId}-${AWS::Region}-artifacts
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldArtifacts
            Status: Enabled
            ExpirationInDays: 30
            NoncurrentVersionExpiration:
              NoncurrentDays: 7

Outputs:
  DeploymentArtifactBucketName:
    Value: !Ref DeploymentArtifactBucket
  DeploymentArtifactBucketArn:
    Value: !GetAtt DeploymentArtifactBucket.Arn
