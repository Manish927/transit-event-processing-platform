name: Deploy Ingestion Lambda

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'contracts/event-contracts/**'
      - 'services/ingestion-lambda/**'
      - 'infra/cloudformation/deployment-artifacts.yaml'
      - 'infra/cloudformation/ingestion.yaml'
      - '.github/workflows/deploy-ingestion.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: transit-ingestion-deployment
  cancel-in-progress: false

env:
  PROJECT_NAME: transit-event
  ENVIRONMENT: dev
  FOUNDATION_STACK: transit-event-dev
  ARTIFACT_STACK: transit-event-dev-deployment-artifacts
  INGESTION_STACK: transit-event-dev-ingestion

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Build shared contracts
        run: mvn --file contracts/event-contracts/pom.xml --batch-mode clean install

      - name: Build ingestion Lambda
        run: |
          mvn --file services/ingestion-lambda/pom.xml --batch-mode clean package
          test -f services/ingestion-lambda/target/ingestion-lambda.jar

      - name: Validate templates
        run: |
          aws cloudformation validate-template --template-body file://infra/cloudformation/deployment-artifacts.yaml
          aws cloudformation validate-template --template-body file://infra/cloudformation/ingestion.yaml

      - name: Deploy artifact bucket
        run: |
          aws cloudformation deploy             --stack-name "${ARTIFACT_STACK}"             --template-file infra/cloudformation/deployment-artifacts.yaml             --parameter-overrides ProjectName="${PROJECT_NAME}" Environment="${ENVIRONMENT}"             --role-arn "${{ vars.CFN_EXECUTION_ROLE_ARN }}"             --no-fail-on-empty-changeset

      - name: Resolve artifact bucket
        run: |
          ARTIFACT_BUCKET=$(aws cloudformation describe-stacks             --stack-name "${ARTIFACT_STACK}"             --query "Stacks[0].Outputs[?OutputKey=='DeploymentArtifactBucketName'].OutputValue | [0]"             --output text)
          echo "ARTIFACT_BUCKET=${ARTIFACT_BUCKET}" >> "${GITHUB_ENV}"

      - name: Upload Lambda artifact
        run: |
          ARTIFACT_KEY="ingestion-lambda/${GITHUB_SHA}/ingestion-lambda.jar"
          aws s3 cp             services/ingestion-lambda/target/ingestion-lambda.jar             "s3://${ARTIFACT_BUCKET}/${ARTIFACT_KEY}"
          echo "ARTIFACT_KEY=${ARTIFACT_KEY}" >> "${GITHUB_ENV}"

      - name: Resolve event queue
        run: |
          EVENT_QUEUE_URL=$(aws cloudformation describe-stacks \
            --stack-name "${FOUNDATION_STACK}" \
            --query "Stacks[0].Outputs[?OutputKey=='EventQueueUrl'].OutputValue | [0]" \
            --output text)

          EVENT_QUEUE_ARN=$(aws cloudformation describe-stacks \
            --stack-name "${FOUNDATION_STACK}" \
            --query "Stacks[0].Outputs[?OutputKey=='EventQueueArn'].OutputValue | [0]" \
            --output text)

          if [ -z "${EVENT_QUEUE_URL}" ] || [ "${EVENT_QUEUE_URL}" = "None" ]; then
            echo "Unable to resolve EventQueueUrl from ${FOUNDATION_STACK}."
            exit 1
          fi

          if [ -z "${EVENT_QUEUE_ARN}" ] || [ "${EVENT_QUEUE_ARN}" = "None" ]; then
            echo "Unable to resolve EventQueueArn from ${FOUNDATION_STACK}."
            exit 1
          fi

          echo "EVENT_QUEUE_URL=${EVENT_QUEUE_URL}" >> "${GITHUB_ENV}"
          echo "EVENT_QUEUE_ARN=${EVENT_QUEUE_ARN}" >> "${GITHUB_ENV}"
          echo "Resolved EventQueueUrl and EventQueueArn from CloudFormation outputs."

      - name: Deploy ingestion Lambda
        run: |
          aws cloudformation deploy             --stack-name "${INGESTION_STACK}"             --template-file infra/cloudformation/ingestion.yaml             --parameter-overrides               ProjectName="${PROJECT_NAME}"               Environment="${ENVIRONMENT}"               EventQueueUrl="${EVENT_QUEUE_URL}"               EventQueueArn="${EVENT_QUEUE_ARN}"               ArtifactBucket="${ARTIFACT_BUCKET}"               ArtifactKey="${ARTIFACT_KEY}"             --capabilities CAPABILITY_NAMED_IAM             --role-arn "${{ vars.CFN_EXECUTION_ROLE_ARN }}"             --no-fail-on-empty-changeset

      - name: Verify deployed ingestion stack
        run: |
          STACK_STATUS=$(aws cloudformation describe-stacks \
            --stack-name "${INGESTION_STACK}" \
            --query "Stacks[0].StackStatus" \
            --output text)

          FUNCTION_NAME=$(aws cloudformation describe-stacks \
            --stack-name "${INGESTION_STACK}" \
            --query "Stacks[0].Outputs[?OutputKey=='IngestionLambdaName'].OutputValue | [0]" \
            --output text)

          if [ "${STACK_STATUS}" != "CREATE_COMPLETE" ] && [ "${STACK_STATUS}" != "UPDATE_COMPLETE" ]; then
            echo "Unexpected ingestion stack status: ${STACK_STATUS}"
            exit 1
          fi

          if [ -z "${FUNCTION_NAME}" ] || [ "${FUNCTION_NAME}" = "None" ]; then
            echo "Unable to resolve IngestionLambdaName."
            exit 1
          fi

          echo "Ingestion stack status: ${STACK_STATUS}"
          echo "Ingestion Lambda: ${FUNCTION_NAME}"
